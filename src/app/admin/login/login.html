<div class="tf-login">
  <div class="tf-login__panel">
    <div class="tf-login__brand">
      <img src="img/logo-icon-square.png" alt="" class="tf-login__mark" />
      <span>TECNOFIX</span>
    </div>
    <span class="tf-eyebrow"><span class="idx">●</span>Panel administrativo</span>
    <h1>Inicia sesión</h1>

    <form (ngSubmit)="enviar()">
      <label for="identifier">Usuario o correo</label>
      <input id="identifier" name="identifier" type="text" [(ngModel)]="identifier" autocomplete="username" />

      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" [(ngModel)]="password" autocomplete="current-password" />

      @if (error()) {
        <p class="tf-login__error">{{ error() }}</p>
      }

      <button type="submit" class="tf-btn tf-btn--primary" [disabled]="cargando()">
        {{ cargando() ? 'Entrando…' : 'Entrar' }}
      </button>
    </form>
  </div>
</div>
